services:
  db:
    image: postgres:16-alpine
    container_name: checklist-db
    environment:
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: checklist
      POSTGRES_DB: checklist
    ports:
      - "127.0.0.1:5433:5432"                        # เปิดเฉพาะเครื่องนี้ (ไม่ให้เครื่องอื่นในเครือข่ายเข้าถึงฐานข้อมูล)
    volumes:
      - checklist-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checklist"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: checklist-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
      PGADMIN_CONFIG_SERVER_MODE: "False"            # dev: ไม่ต้องล็อกอิน pgAdmin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5051:80"                          # เปิดเฉพาะเครื่องนี้ เพราะไม่มีรหัสผ่าน (5050 ถูก pgadmin ตัวเดิมใช้อยู่)
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ===== สำหรับให้ผู้ใช้ภายนอกเข้าทดสอบ: docker compose --profile web up -d --build =====
  app:
    profiles: ["web"]
    build: .
    image: checklist-app
    container_name: checklist-app
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://checklist:checklist@db:5432/checklist
      JWT_SECRET: ${JWT_SECRET:-}                    # ตั้งในไฟล์ .env ข้าง docker-compose.yml
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: ["web"]
    image: nginx:1.27-alpine
    container_name: checklist-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"                        # ประตูเดียวที่เปิดให้ผู้ใช้ภายนอก
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  checklist-data:
  pgadmin-data:
