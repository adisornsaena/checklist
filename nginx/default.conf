# nginx หน้าด่านของระบบ Checklist Online: รับผู้ใช้ภายนอกแล้วส่งต่อให้แอป (container "app" พอร์ต 4000)

# จำกัดความถี่ต่อ IP: กันการเดารหัสผ่าน และกันการยิง API ถี่ผิดปกติ
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

upstream checklist_app {
    server app:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # security headers (CSP, X-Frame-Options ฯลฯ) ตั้งที่แอป Express ทุก response แล้ว ไม่ตั้งซ้ำที่นี่

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ส่งเฉพาะ IP ที่ต่อเข้ามาจริง ไม่ต่อท้ายค่า X-Forwarded-For ที่ผู้ใช้ปลอมมาได้
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://checklist_app;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://checklist_app;
    }

    # ไฟล์ JS/CSS ที่ build แล้วมีแฮชในชื่อไฟล์ จึงเก็บแคชในเบราว์เซอร์ได้นาน
    location /assets/ {
        proxy_pass http://checklist_app;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        expires 30d;
    }

    # หน้าเว็บ (index.html, โลโก้) — ไม่แคช เพื่อให้ได้เวอร์ชันล่าสุดทุกครั้งที่อัปเดตระบบ
    location / {
        proxy_pass http://checklist_app;
    }
}
